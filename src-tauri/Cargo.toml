[package]
name = "allinssl-desktop"
version = "0.0.1"
description = "ALLinSSL 桌面端"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-single-instance = "2"
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
windows = { version = "0.62.2", features = ["Security_Credentials_UI", "Win32_System_WinRT", "Win32_System_Com", "Win32_System_Threading", "Win32_Security_Credentials"] }
windows-future = "0.3.2"

[profile.release]
strip = true
lto = "thin"
